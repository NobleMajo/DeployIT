name: Go tag release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*" # allowing for release tags
      - "v[0-9]*.[0-9]*.[0-9]*-*" # allowing for pre-release tags

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify SemVer tag (ERE v[0-9]+.[0-9]+.[0-9]+ optional -/+ suffix)
        run: |
          ref_name="${GITHUB_REF_NAME}"
          printf '%s\n' "$ref_name" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$' || {
            printf '%s\n' "Tag does not match SemVer: $ref_name" >&2
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            DeployIT release ${{ github.ref_name }}.

            Prebuilt binaries are attached by the **Go binary release** workflow after this job finishes.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
